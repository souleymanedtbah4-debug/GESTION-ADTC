<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Association pour le Développement de Donghol Touma Centre – Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style id="appStyle">
:root{
  --bg:#f6f3ec; --panel:#ffffff; --ink:#1f2a24; --muted:#6b756f; --line:#e4dfd3;
  --green:#1f6b4a; --green-2:#2f8a62; --green-soft:#e3f1ea; --ochre:#c7832a; --ochre-soft:#f8ecd9;
  --red:#b4442f; --red-soft:#f7e2dd; --blue:#2c5d8f; --blue-soft:#e1ebf5;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(31,42,36,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--green);color:#eaf4ee;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.brand h1{font-size:17px;line-height:1.25;color:#fff}
#assoLogo{width:100%;max-width:190px;background:#fff;border-radius:12px;padding:6px;margin:0 auto 12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (max-width:860px){#assoLogo{max-width:110px;margin:0 0 8px}}
.brand small{display:block;opacity:.75;margin-top:4px;font-size:12px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:500}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:#fff;color:var(--green)}
nav .ico{width:20px;text-align:center}
.status{margin-top:18px;font-size:12px;opacity:.85;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.15)}
main{padding:26px 30px 60px;max-width:1250px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:26px}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#faf8f3}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .val{font-family:Fraunces,serif;font-size:24px;margin-top:6px;font-weight:700}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.pos .val{color:var(--green)} .kpi.neg .val{color:var(--red)}
.two{grid-template-columns:1.3fr 1fr;margin-top:14px}
.card h3{font-size:16px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;background:#faf8f3}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:#fcfbf7}
.tbl{overflow:auto;padding:0}
.tbl table{min-width:640px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.b-green{background:var(--green-soft);color:var(--green)}
.b-ochre{background:var(--ochre-soft);color:#8a5612}
.b-red{background:var(--red-soft);color:var(--red)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-grey{background:#eeece6;color:#555}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:170px}
.bar{height:10px;background:#eeeae0;border-radius:6px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--green-2);border-radius:6px}
.bar.ochre>span{background:var(--ochre)}
.rowbar{display:grid;grid-template-columns:130px 1fr 130px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.rowbar .n{text-align:right;font-variant-numeric:tabular-nums}
.cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.pcard h3{font-size:17px;margin-bottom:4px}
.pcard .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.pcard .line{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}
.pcard .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.acts-cell{white-space:nowrap;text-align:right}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:2px 4px;font-weight:500}
.link.red{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;z-index:20;overflow:auto}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:20px;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#3e4842}
.form input,.form select,.form textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-weight:400;background:#fff}
.form textarea{min-height:70px;resize:vertical}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.banner{background:var(--ochre-soft);border:1px solid #ecd3ab;color:#7a4b0f;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
/* --- Écran de connexion --- */
#gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate.on{display:flex}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:28px}
.gate-card img{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 14px}
.gate-card h2{font-family:Fraunces,Georgia,serif;color:var(--green);text-align:center;margin:0 0 4px;font-size:19px;line-height:1.3}
.gate-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.gate-card label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:12px}
.gate-card input{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.gate-card input:focus{outline:2px solid var(--green-2);outline-offset:-1px}
.gate-card .btn{width:100%;padding:11px;font-size:15px;margin-top:4px}
.gate-msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.gate-msg.err{display:block;background:var(--red-soft);border:1px solid #e8c4bb;color:#8a2f1d}
.gate-msg.info{display:block;background:var(--blue-soft);border:1px solid #c5d8ea;color:#214b73}
.gate-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.who{margin-top:14px;font-size:12px;background:rgba(0,0,0,.15);border-radius:8px;padding:9px 10px}
.who b{display:block;font-size:13px;margin-bottom:2px}
.who button{margin-top:7px;background:rgba(255,255,255,.14);color:#eaf4ee;border:0;border-radius:6px;padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
.who button:hover{background:rgba(255,255,255,.25)}
.note{color:var(--muted);font-size:12.5px}
.flag{font-size:18px;margin-right:4px}
.menu-toggle{display:none}
/* Couleurs par rubrique et par carte */
:root{--accent:#1f6b4a}
aside{background:var(--accent);transition:background .3s}
nav button.on{color:var(--accent)}
.head{border-bottom:3px solid var(--accent);padding-bottom:12px}
.head h2{color:var(--accent)}
.btn{background:var(--accent)} .btn:hover{background:var(--accent);filter:brightness(1.12)}
.btn.ghost{background:#fff;color:var(--ink)} .btn.danger{background:var(--red)}
.c1{--c:#1f6b4a;--cs:#dff0e7} .c2{--c:#2c5d8f;--cs:#dde8f5} .c3{--c:#c7832a;--cs:#f9ead3}
.c4{--c:#7a3f8f;--cs:#f0e2f5} .c5{--c:#0f7c80;--cs:#d9f0f0} .c6{--c:#b4442f;--cs:#f8dfd9}
.kpi[class*=" c"]{border-left:6px solid var(--c);background:linear-gradient(135deg,var(--cs) 0%,#fff 75%)}
.kpi[class*=" c"] .lbl,.kpi[class*=" c"] .val{color:var(--c)}
.kpi.neg .val{color:var(--red)}
.panel{border-top:5px solid var(--c);background:linear-gradient(180deg,var(--cs) 0,#fff 110px)}
.panel h3{color:var(--c)} .panel .bar>span{background:var(--c)}
.pcard{border-top:5px solid var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tabs button span{font-weight:400;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button.on span{color:rgba(255,255,255,.85)}
.months{display:flex;gap:2px}
.mcell{display:inline-flex;width:16px;height:20px;align-items:center;justify-content:center;border-radius:4px;font-size:10px;font-style:normal;font-weight:600;background:#eeeae0;color:#9a978e}
.mcell.paid{background:var(--green-2);color:#fff}
.mcell.late{background:var(--red-soft);color:var(--red)}
.mcell.na{background:transparent;color:#ccc}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.modal.wide{width:min(820px,100%)}
.cardimg{width:100%;height:auto;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.amountEdit{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px}
.amountEdit input{width:120px;min-width:0!important;padding:5px 8px!important}
tr.total td{background:#f3efe4;border-top:2px solid var(--line)}
select.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
a.btn.wa{background:#25a244;color:#fff;text-decoration:none;display:inline-block}
a.btn.wa:hover{background:#1e8c3a}
label.check{flex-direction:row!important;align-items:center;gap:8px!important;font-weight:500!important;background:var(--ochre-soft);padding:9px 10px;border-radius:8px}
label.check input{width:18px;height:18px}
.formerr{background:var(--red-soft);color:var(--red);padding:8px 10px;border-radius:8px;font-weight:600}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:12px}
  nav{display:flex;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap;width:auto}
  .brand{border:0;padding-bottom:8px;margin-bottom:6px}
  .status{display:none}
  main{padding:18px 14px 50px}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .rowbar{grid-template-columns:90px 1fr 100px}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><img id="assoLogo" alt="Logo" style="display:none"><h1 id="assoName">Association pour le Développement de Donghol Touma Centre</h1><small id="assoSub">Donghol Touma Centre</small></div>
    <nav id="nav"></nav>
    <div class="status" id="saveStatus">Chargement…</div>
    <div class="who" id="whoBox" style="display:none"></div>
  </aside>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>
<div id="gate">
  <form class="gate-card" onsubmit="gateSubmit(event)">
    <img id="gateLogo" alt="">
    <h2 id="gateTitle">Association pour le Développement de Donghol Touma Centre</h2>
    <div class="sub">Espace de gestion réservé aux responsables</div>
    <div class="gate-msg" id="gateMsg"></div>
    <label>Adresse e-mail<input type="email" id="gateMail" autocomplete="username" required></label>
    <label>Mot de passe<input type="password" id="gatePass" autocomplete="current-password" required></label>
    <button class="btn" id="gateBtn">Se connecter</button>
    <button type="button" class="btn ghost" id="gateLocal" style="display:none;width:100%;margin-top:8px" onclick="modeLocal()">Continuer sans compte (mode local)</button>
    <div class="gate-foot">Vous n'avez pas de compte ? Demandez-le au président ou au trésorier de l'association.</div>
  </form>
</div>

const bureauTaux = id => { const b = byId('bureaux', id); const t = num(b && b.taux); return t > 0 ? t : (bureauDevise(id) === deviseBase() ? 1 : 0); };
const fmoney = (v, dev) => new Intl.NumberFormat('fr-FR').format(Math.round(num(v))) + ' ' + (dev || '');
/* Montant d'une contribution exprimé dans la devise locale du bureau (vide si même devise) */
function contribLocal(c){
  const dev = bureauDevise(c.bureauId);
  if (num(c.montantDevise) && dev !== deviseBase()) return fmoney(c.montantDevise, dev);
  return c.montantOrigine || '';
}
function contribLocalTotal(bId, list){
  const dev = bureauDevise(bId); if (dev === deviseBase()) return '';
  const t = sum(list, c => c.montantDevise); return t ? fmoney(t, dev) : '';
}

/* ---------- Calculs ---------- */
const ctype = c => c.type || 'Mensuelle';
function memberPaid(mId, year){ return sum(S.cotisations.filter(c => ctype(c) === 'Mensuelle' && c.membreId === mId && num(c.annee) === year)); }
function memberProjetPaid(mId, pId){ return sum(S.cotisations.filter(c => ctype(c) === 'Par projet' && c.membreId === mId && c.projetId === pId)); }
/* Nombre de mois dus pour une année (tient compte de la date d'adhésion) */
function moisDus(m, year){
  const fin = year < thisYear ? 12 : year === thisYear ? new Date().getMonth() + 1 : 0;
  let debut = 1;
  if (m.adhesion){ const ay = +m.adhesion.slice(0,4), am = +m.adhesion.slice(5,7); if (ay > year) return 0; if (ay === year) debut = am; }
  return Math.max(0, fin - debut + 1);
}
function rateFor(m){ return m && num(m.cotisationMensuelle) ? num(m.cotisationMensuelle) : num(S.settings.cotisationMensuelle); }
function moisCouverts(m, year){ const r = rateFor(m); return r ? Math.floor(memberPaid(m.id, year) / r) : 0; }
function retardMois(m, year){ return Math.max(0, moisDus(m, year) - moisCouverts(m, year)); }
function activeMembers(){ return S.membres.filter(m => (m.statut || 'Actif') === 'Actif'); }
function projetCotis(pId){ return sum(S.cotisations.filter(c => c.projetId === pId && ctype(c) !== 'Mensuelle')); }
function projetFinance(pId){ return sum(S.contributions.filter(c => c.projetId === pId)) + projetCotis(pId); }
function monthlyStatusBadge(m, year){
  if ((m.statut || 'Actif') !== 'Actif') return '<span class="badge b-grey">—</span>';
  const r = retardMois(m, year);
  return r === 0 ? '<span class="badge b-green">À jour</span>' : `<span class="badge ${r>2?'b-red':'b-ochre'}">${r} mois de retard</span>`;
}
function projetDepense(pId){ return sum(S.depenses.filter(d => d.projetId === pId)); }
function bureauStats(bId){
  const membres = S.membres.filter(m => m.bureauId === bId);
  const ids = new Set(membres.map(m => m.id));
  const cot = sum(S.cotisations.filter(c => ids.has(c.membreId)));
  const liste = S.contributions.filter(c => c.bureauId === bId);
  const contrib = sum(liste);
  const contribYear = sum(liste.filter(c => (c.date||'').startsWith(String(thisYear))));
  return { membres, cot, contrib, contribYear, total: cot + contrib, locale: contribLocalTotal(bId, liste), devise: bureauDevise(bId) };
}
function totals(){
  const entrees = sum(S.cotisations) + sum(S.contributions);
  const sorties = sum(S.depenses) + sum(S.social.filter(s => s.etat !== 'Refusée' && s.etat !== 'En attente'));
  return { entrees, sorties, solde: entrees - sorties };
}

/* ---------- Paiements par bureau ---------- */
function bureauPayments(bId, year){
  const ids = new Set(S.membres.filter(m => m.bureauId === bId).map(m => m.id));
  const inY = d => !year || String(d || '').startsWith(String(year));
  const cot = S.cotisations.filter(c => ids.has(c.membreId) && (!year || num(c.annee) === +year || inY(c.date)))
    .map(c => ({ kind:'cot', id:c.id, date:c.date, type:ctype(c), payeur:donorName(c), objet:recuDetails(c).objet, mode:c.mode, montant:num(c.montant), recu:c.recuNum || c.recu }));
  const con = S.contributions.filter(c => c.bureauId === bId && inY(c.date))
    .map(c => ({ kind:'con', id:c.id, date:c.date, type:'Contribution du bureau', payeur:'Bureau ' + bureauName(bId), objet:(c.objet || 'Contribution') + (c.projetId ? ' — projet « ' + nameOf('projets', c.projetId, 'nom') + ' »' : ' — caisse générale') + (contribLocal(c) ? ' (' + contribLocal(c) + ')' : ''), mode:c.mode, montant:num(c.montant), locale:contribLocal(c) }));
  return [...cot, ...con].sort((a,b) => (b.date||'').localeCompare(a.date||''));
}
function bureauTotals(bId, year){
  const l = bureauPayments(bId, year), t = k => sum(l.filter(x => x.type === k));
  return { list:l, mens:t('Mensuelle'), proj:t('Par projet'), vol:t('Volontaire'), contrib:t('Contribution du bureau'), total:sum(l) };
}

function waNumber(tel){
  let d = String(tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1); else if (d.startsWith('00')) d = d.slice(2);
  else if (d.length === 9 && d.startsWith('6')) d = (S.settings.indicatif || '224') + d;
  return d.length >= 8 ? d : '';
}
function omInstructions(){
  const st = S.settings, l = [];

  if (st.omMarchand) l.push(`Code marchand : ${st.omMarchand}`);

/* ================= Annonces des affaires sociales =================
   Messages prêts à envoyer sur WhatsApp : mariage, baptême, décès.      */
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function dateLongue(d, relatif){
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00'); if (isNaN(dt)) return '';
  const base = `${JOURS[dt.getDay()]} ${String(dt.getDate()).padStart(2,'0')} ${MOIS[dt.getMonth()].toLowerCase()} ${String(dt.getFullYear()).slice(2)}`;
  if (!relatif) return base;
  const diff = Math.round((dt - new Date(today() + 'T00:00:00')) / 86400000);
  if (diff === 0) return `aujourd'hui ${base}`;
  if (diff === 1) return `demain ${base}`;
  if (diff === -1) return `hier ${base}`;
  return base;
}
const heureFr = h => { if (!h) return ''; const [a,b] = String(h).split(':'); return b && b !== '00' ? `${a}h${b}` : `${a}h`; };
const villageCourt = () => (S.settings.village || S.settings.nom || 'Donghol').split(/[\s,–-]+/)[0];
const familleAnnonce = t => t === 'Décès' ? 'deces' : t === 'Mariage' ? 'mariage'
  : t === 'Naissance / Baptême' ? 'bapteme' : 'autre';

const ANN_CHAMPS = {
  deces: [
    {k:'defunt',l:'Nom du défunt',req:1},{k:'origine',l:'Village / quartier d\'origine'},
    {k:'sexe',l:'Homme ou femme',t:'select',o:['Homme','Femme']},
    {k:'lieuDeces',l:'Décédé(e) à'},{k:'dateDeces',l:'Date du décès',t:'date'},
    {k:'dateCond',l:'Condoléances — date',t:'date'},{k:'heureCond',l:'Condoléances — à partir de',t:'time'},
    {k:'lieuCond',l:'Condoléances — lieu',full:1},
    {k:'dateEnt',l:'Enterrement — date',t:'date'},{k:'heureEnt',l:'Enterrement — heure',t:'time'},
    {k:'lieuEnt',l:'Enterrement — lieu',full:1},
    {k:'autre',l:'Autre cérémonie le même jour (facultatif)',t:'textarea',full:1}],
  mariage: [
    {k:'marie',l:'Le marié',req:1},{k:'mariee',l:'La mariée (ou « une fille de… »)'},
    {k:'date',l:'Date du mariage',t:'date'},{k:'lieu',l:'Lieu'},
    {k:'appel',l:'Appel aux parents présents à (lieu)',full:1}],
  bapteme: [
    {k:'parents',l:'Parents / famille',req:1},{k:'enfant',l:'Nom de l\'enfant (facultatif)'},
    {k:'date',l:'Date du baptême',t:'date'},{k:'lieu',l:'Lieu'},
    {k:'appel',l:'Appel aux parents présents à (lieu)',full:1}],
  autre: [
    {k:'objet',l:'Objet de l\'annonce',req:1},{k:'personne',l:'Personne / famille concernée'},
    {k:'date',l:'Date',t:'date'},{k:'lieu',l:'Lieu'},
    {k:'details',l:'Détails',t:'textarea',full:1}]
};
function annDefauts(s, fam){
  if (fam === 'deces')   return { defunt:s.beneficiaire||'', sexe:'Homme', dateDeces:s.date||'', lieuCond:'', lieuEnt:'' };
  if (fam === 'mariage') return { marie:s.beneficiaire||'', date:s.date||'' };
  if (fam === 'bapteme') return { parents:s.beneficiaire||'', date:s.date||'' };
  return { objet:s.type||'', personne:s.beneficiaire||'', date:s.date||'', details:s.notes||'' };
}
function annTexteGen(fam, a){
  const L = ['Bonjour tout le monde,'], asso = S.settings.nom || '', vc = villageCourt();
  if (fam === 'deces'){
    const e = a.sexe === 'Femme' ? 'e' : '';
    let p = `Information du décès de ${a.defunt || '…'}`;
    if (a.origine) p += ` ${a.origine}`;
    if (a.lieuDeces || a.dateDeces){
      p += `, décédé${e}`;
      if (a.lieuDeces) p += ` à ${a.lieuDeces}`;
      if (a.dateDeces) p += ` ${dateLongue(a.dateDeces, true)}`;
    }
    L.push(p + '.');
    if (a.dateCond || a.lieuCond || a.heureCond){
      let c = 'La présentation des condoléances est prévue';
      if (a.dateCond) c += ` ${dateLongue(a.dateCond, true)}`;
      if (a.lieuCond) c += ` à ${a.lieuCond}`;
      if (a.heureCond) c += ` à partir de ${heureFr(a.heureCond)}`;
      L.push(c + '.');
    }
    if (a.dateEnt || a.heureEnt || a.lieuEnt){
      let t = 'L\'enterrement est prévu';
      if (a.dateEnt) t += ` ${dateLongue(a.dateEnt, true)}`;
      if (a.heureEnt) t += ` à ${heureFr(a.heureEnt)}`;
      if (a.lieuEnt) t += ` à ${a.lieuEnt}`;
      L.push(t + '.');
    }
    if (a.autre) L.push(String(a.autre).trim());
    L.push(a.autre ? 'Que les âmes des défunts reposent en paix. Amen.' : `Que son âme repose en paix. Amen.`);
  }
  else if (fam === 'mariage'){
    let p = `Information du mariage de ${a.marie || '…'}`;
    if (a.mariee) p += ` avec ${a.mariee}`;
    if (a.date) p += `, prévu ${dateLongue(a.date, true)}`;
    if (a.lieu) p += ` à ${a.lieu}`;
    L.push(p + '.');
    if (a.appel) L.push(`Nous demandons à nos parents de ${vc} à ${a.appel} de s'impliquer.`);
    L.push('Nous leur souhaitons un heureux mariage. Tout le monde est invité.');
    L.push('Merci.');
  }
  else if (fam === 'bapteme'){
    let p = `Information du baptême${a.enfant ? ' de ' + a.enfant : ''} dans la famille de ${a.parents || '…'}`;
    if (a.date) p += `, prévu ${dateLongue(a.date, true)}`;
    if (a.lieu) p += ` à ${a.lieu}`;
    L.push(p + '.');
    if (a.appel) L.push(`Nous demandons à nos parents de ${vc} à ${a.appel} de s'impliquer.`);
    L.push('Tout le monde est invité. Merci.');
  }
  else {
    let p = `Information : ${a.objet || '…'}`;
    if (a.personne) p += ` — ${a.personne}`;
    if (a.date) p += `, ${dateLongue(a.date, true)}`;
    if (a.lieu) p += ` à ${a.lieu}`;
    L.push(p + '.');
    if (a.details) L.push(String(a.details).trim());
    L.push('Nous demandons à tout le monde de s\'impliquer. Merci.');
  }
  if (asso) L.push(asso);
  return L.join('\n\n');
}
function openAnnonce(id){
  const s = byId('social', id); if (!s) return;
  const fam = familleAnnonce(s.type), champs = ANN_CHAMPS[fam];
  const a = Object.assign(annDefauts(s, fam), s.ann || {});
  window.__ann = { id, fam, a, manuel: !!s.annTexte };
  $('#modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>📢 Annonce — ${esc(s.type)}</h3>
    <p class="note" style="margin:-4px 0 12px">Complétez les informations : le message se rédige tout seul en dessous. Vous pouvez le corriger à la main avant de l'envoyer.</p>
    <form class="form" id="annForm" oninput="annRefresh()" onsubmit="return false">${champs.map(f => fieldHTML(f, a[f.k])).join('')}</form>
    <div style="margin-top:14px"><b style="font-size:13px">Message à envoyer</b>
      <textarea id="annTxt" style="width:100%;height:230px;font-size:13px;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;line-height:1.5" oninput="window.__ann.manuel=true;annWaLien()"></textarea></div>
    <div class="foot full" style="margin-top:12px">
      <button class="btn ghost" onclick="annRefresh(true)">↻ Régénérer le texte</button>
      <button class="btn ghost" onclick="copyText($('#annTxt').value, this)">📋 Copier</button>
      <a class="btn wa" id="annWa" target="_blank" rel="noopener">📱 Envoyer sur WhatsApp</a>
      ${canWrite ? '<button class="btn" onclick="annSave()">Enregistrer l\'annonce</button>' : ''}
      <button class="btn ghost" onclick="closeModal()">Fermer</button>
    </div></div></div>`;
  if (s.annTexte){ $('#annTxt').value = s.annTexte; annWaLien(); } else annRefresh(true);
}
function annLire(){
  const f = $('#annForm'), a = {};
  ANN_CHAMPS[window.__ann.fam].forEach(c => { const el = f.elements[c.k]; if (el) a[c.k] = el.value; });
  window.__ann.a = a; return a;
}
function annRefresh(force){
  const a = annLire();
  if (force || !window.__ann.manuel){ $('#annTxt').value = annTexteGen(window.__ann.fam, a); if (force) window.__ann.manuel = false; }
  annWaLien();
}
function annWaLien(){
  const t = $('#annTxt').value;
  $('#annWa').href = 'https://wa.me/?text=' + encodeURIComponent(t);
}
function annSave(){
  const s = byId('social', window.__ann.id); if (!s) return;
  s.ann = annLire(); s.annTexte = $('#annTxt').value;
  persist(); closeModal(); render(); info('Annonce enregistrée avec l\'affaire sociale.');
}

function fieldHTML(f, v){
  const name = `name="${f.k}" ${f.req?'required':''}`;
  let inp;
  if (f.t === 'check') return `<label class="full check"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${esc(f.l)}</label>`;
  if (f.t === 'photo') inp = `<div style="display:flex;gap:12px;align-items:center"><img class="pv" src="${esc(v)}" style="width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);${v?'':'display:none'}"><input type="file" accept="image/*" onchange="onPhotoPick(this)"><input type="hidden" name="${f.k}" value="${esc(v)}"></div>`;
  else if (f.t === 'textarea') inp = `<textarea ${name}>${esc(v)}</textarea>`;
  else if (f.t === 'select') inp = `<select ${name}>${f.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.t === 'bureau') inp = `<select ${name}><option value="">— choisir —</option><option value="village" ${v==='village'?'selected':''}>Au village (pas de bureau)</option>${S.bureaux.map(b=>`<option value="${b.id}" ${b.id===v?'selected':''}>${esc(bureauLabel(b))}</option>`).join('')}</select>`;
  else if (f.t === 'membre') inp = `<select ${name}><option value="">— choisir —</option>${[...S.membres].sort((a,b)=>(a.nom||'').localeCompare(b.nom||'')).map(m=>`<option value="${m.id}" ${m.id===v?'selected':''}>${esc(m.nom)}</option>`).join('')}</select>`;
  else if (f.t === 'projet') inp = `<select ${name}><option value="">— aucun —</option>${S.projets.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.nom)}</option>`).join('')}</select>`;
  else inp = `<input ${name} type="${f.t||'text'}" ${f.t==='number'?'step="any" min="0"':''} value="${esc(v)}">`;
  return `<label class="${f.full?'full':''}" ${f.when?`data-when="${f.when.join('|')}"`:''}>${esc(f.l)}${f.req?' *':''}${inp}</label>`;
}

/* Formulaire bureau : propose la devise du pays et libelle le taux de change */
function bureauFormSync(auto){
  const f = $('#modalRoot form'); if (!f || !f.devise) return;
  const base = deviseBase();
  const sync = () => {
    const d = f.devise.value, same = d === base || d === 'Autre';
    f.taux.closest('label').firstChild.textContent = same ? `Taux de change (sans objet : même devise)` : `Taux de change : 1 ${d} = ? ${base}`;
    f.taux.disabled = same; if (same) f.taux.value = '';
  };
  if (!auto) f.devise.dataset.manuel = '1';
  if (auto){ const d = deviseDuPays(f.pays.value); if (d) f.devise.value = d; }
  f.pays.oninput = () => { if (f.devise.dataset.manuel) return; const d = deviseDuPays(f.pays.value); if (d){ f.devise.value = d; sync(); } };
  f.devise.onchange = () => { f.devise.dataset.manuel = '1'; sync(); };
  sync();
}
/* Formulaire contribution : convertit la devise locale du bureau vers celle de l'association */
function contribFormSync(majBureau){
  const f = $('#modalRoot form'); if (!f || !f.montantDevise) return;
  const base = deviseBase(), dev = f.bureauId.value ? bureauDevise(f.bureauId.value) : base, same = dev === base;
  f.montantDevise.closest('label').firstChild.textContent = `Montant envoyé en ${dev}`;
  f.taux.closest('label').firstChild.textContent = `Taux appliqué : 1 ${dev} = ? ${base}`;
  f.montant.closest('label').firstChild.textContent = `Montant reçu en ${base} *`;
  f.montantDevise.closest('label').style.display = same ? 'none' : '';

function cotisFormSync(suggest){

function resizeImage(file, w, h, cover, type){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let cw = w, ch = h, sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (cover){ const r = Math.max(w / sw, h / sh); const vw = w / r, vh = h / r; sx = (sw - vw) / 2; sy = (sh - vh) / 2; sw = vw; sh = vh; }
      else { const r = Math.min(w / sw, h / sh, 1); cw = Math.round(sw * r); ch = Math.round(sh * r); }
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const x = c.getContext('2d'); if (type === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0,0,cw,ch); }
      x.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch); URL.revokeObjectURL(url);
      res(c.toDataURL(type || 'image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

function rr(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function fitText(x, t, maxW, size, font){ let s = size; do { x.font = font.replace('#', s); s -= 1; } while (x.measureText(t).width > maxW && s > 12); }
function logoBox(x, logo, X, Y, h, fallbackText, color, maxW){
  const ar = logo ? logo.width / logo.height : 1, w = Math.min(maxW || 9999, Math.round(h * ar));
  x.save(); rr(x, X, Y, w, h, Math.min(16, h * .15)); x.fillStyle = '#fff'; x.fill(); x.clip();
  if (logo){ const p = h * .04, r = Math.min((w - 2*p) / logo.width, (h - 2*p) / logo.height); x.drawImage(logo, X + (w - logo.width*r)/2, Y + (h - logo.height*r)/2, logo.width*r, logo.height*r); }
  else { x.fillStyle = color || '#1f6b4a'; x.font = `700 ${h*.38}px Fraunces, Georgia, serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(initials(fallbackText), X+w/2, Y+h/2+2); }
  x.restore(); x.textAlign = 'left'; x.textBaseline = 'alphabetic'; return w;
}

function drawQR(x, text, X, Y, size){
  if (typeof qrcode === 'undefined') return;
  try { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; } catch(e){}
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), c = size / (n + 2);
  x.fillStyle = '#fff'; x.fillRect(X, Y, size, size); x.fillStyle = '#1f2a24';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(X + (k+1)*c, Y + (r+1)*c, Math.ceil(c), Math.ceil(c));

    if (logo){ const r = Math.min((s-12)/logo.width, (s-12)/logo.height); x.drawImage(logo, X + (s - logo.width*r)/2, Y + (s - logo.height*r)/2, logo.width*r, logo.height*r); }
    else { x.fillStyle = green; x.font = `700 ${s*.38}px ${SER}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(initials(st.nom), X+s/2, Y+s/2+2); }

function nextRecu(){ const n = num(S.settings.nextRecu) || 1; S.settings.nextRecu = n + 1; return `REC-${thisYear}-${String(n).padStart(5,'0')}`; }
function enLettres(n){
  n = Math.round(Math.abs(num(n)));
  const u = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d = ['','','vingt','trente','quarante','cinquante','soixante'];
  const b100 = (x, fin) => { if (x < 20) return u[x]; const t = Math.floor(x/10), r = x % 10;
    if (t < 7) return d[t] + (r === 0 ? '' : r === 1 ? ' et un' : '-' + u[r]);
    if (t === 7) return 'soixante' + (r === 1 ? ' et onze' : '-' + u[10 + r]);
    if (t === 8) return r === 0 ? (fin ? 'quatre-vingts' : 'quatre-vingt') : 'quatre-vingt-' + u[r];
    return 'quatre-vingt-' + u[10 + r]; };
  const b1000 = (x, fin) => { const c = Math.floor(x/100), r = x % 100; let s = '';
    if (c) s = c === 1 ? 'cent' : b100(c) + ' cent' + (r === 0 && fin ? 's' : '');
    if (r) s += (s ? ' ' : '') + b100(r, fin); return s; };
  if (n === 0) return 'zéro';
  const md = Math.floor(n / 1e9), mi = Math.floor(n / 1e6) % 1000, k = Math.floor(n / 1000) % 1000, r = n % 1000, out = [];
  if (md) out.push(md === 1 ? 'un milliard' : b1000(md, true) + ' milliards');
  if (mi) out.push(mi === 1 ? 'un million' : b1000(mi, true) + ' millions');
  if (k) out.push(k === 1 ? 'mille' : b1000(k, false) + ' mille');
  if (r) out.push(b1000(r, true));
  return out.join(' ');
}
function deviseLettres(){ const d = (S.settings.devise || '').trim().toUpperCase();
  return ({GNF:'francs guinéens', XOF:'francs CFA', XAF:'francs CFA', EUR:'euros', USD:'dollars', CNY:'yuans'})[d] || S.settings.devise || ''; }
/* Détail d'un paiement : mois couverts, situation après paiement */
function recuDetails(c){
  const t = ctype(c), m = byId('membres', c.membreId), y = num(c.annee);
  const before = (list) => { const s = list.sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.recuNum||'').localeCompare(b.recuNum||'')); const i = s.findIndex(x => x.id === c.id); return sum(s.slice(0, i)); };
  if (t === 'Mensuelle' && m){
    const r = rateFor(m); if (!r) return { objet:`Cotisation mensuelle ${y}`, situation:'' };
    const prev = before(S.cotisations.filter(x => ctype(x)==='Mensuelle' && x.membreId === m.id && num(x.annee) === y));
    const debut = m.adhesion && +m.adhesion.slice(0,4) === y ? +m.adhesion.slice(5,7) : 1;
    const from = Math.floor(prev / r), to = Math.floor((prev + num(c.montant)) / r);
    const nm = i => i <= 12 ? MOIS[i-1] : `${MOIS[(i-1)%12]} ${y + Math.floor((i-1)/12)}`;
    let objet = `Cotisation mensuelle ${y}`;
    if (to > from){ const a = debut + from, z = debut + to - 1; objet += ` — ${a === z ? 'mois de ' + nm(a) : 'mois de ' + nm(a) + ' à ' + nm(z)}`; }
    else objet += ` — acompte (mois de ${nm(debut + from)})`;
    const upto = debut + to - 1, dus = moisDus(m, y), retard = Math.max(0, dus - to);
    const situation = to <= 0 ? `Aucun mois entièrement réglé en ${y}` : retard === 0 ? `À jour jusqu'à ${nm(upto)} ${upto <= 12 ? y : ''}`.trim() : `Réglé jusqu'à ${nm(upto)} ${y} — ${retard} mois restant(s) dû(s)`;
    return { objet, situation: situation + ` · Tarif : ${money(r)} / mois` };
  }
  if (t === 'Par projet'){
    const p = byId('projets', c.projetId), r = p ? num(p.cotisationParMembre) : 0;
    const prev = before(S.cotisations.filter(x => ctype(x)==='Par projet' && x.membreId === c.membreId && x.projetId === c.projetId));
    const tot = prev + num(c.montant);
    return { objet:`Cotisation pour le projet « ${p ? p.nom : '—'} »`,
      situation: r ? (tot >= r ? `Cotisation du projet entièrement réglée (${money(tot)} / ${money(r)})` : `Total versé ${money(tot)} / ${money(r)} — reste ${money(r - tot)}`) : `Total versé pour ce projet : ${money(tot)}` };
  }
  return { objet: `Don volontaire${c.projetId ? ' pour le projet « ' + nameOf('projets', c.projetId, 'nom') + ' »' : ' à la caisse de l\'association'}`, situation:'Merci pour votre générosité envers le village.' };
}

/* ---------- Conversion JSON ⇄ Firestore ---------- */
function versFs(v){
  if (v === null || v === undefined) return { nullValue:null };
  if (typeof v === 'boolean') return { booleanValue:v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue:String(v) } : { doubleValue:v };
  if (Array.isArray(v)) return { arrayValue:{ values:v.map(versFs) } };
  if (typeof v === 'object') return { mapValue:{ fields:champsFs(v) } };
  return { stringValue:String(v) };
}
const champsFs = o => { const f = {}; for (const k in o) if (k !== 'id') f[k] = versFs(o[k]); return f; };
function depuisFs(f){
  if (!f) return null;
  if ('nullValue' in f) return null;
  if ('booleanValue' in f) return f.booleanValue;
  if ('integerValue' in f) return Number(f.integerValue);
  if ('doubleValue' in f) return Number(f.doubleValue);
  if ('stringValue' in f) return f.stringValue;
  if ('arrayValue' in f) return (f.arrayValue.values || []).map(depuisFs);
  if ('mapValue' in f) { const o = {}; const ff = f.mapValue.fields || {}; for (const k in ff) o[k] = depuisFs(ff[k]); return o; }
  return null;
}
const objetFs = doc => { const o = {}; const ff = doc.fields || {}; for (const k in ff) o[k] = depuisFs(ff[k]); o.id = doc.name.split('/').pop(); return o; };

async function erreurFs(r){
  const d = await r.json().catch(() => null);
  const m = (d && d.error && d.error.message) || '';
  if (r.status === 403 || /PERMISSION_DENIED/.test(m)) return 'Accès refusé par les règles de sécurité Firestore.';
  if (r.status === 401) return 'Session expirée, reconnectez-vous.';
  if (r.status === 404) return 'Projet ou base Firestore introuvable — vérifiez l\'ID du projet.';
  return 'Firestore : ' + (m || r.status);
}

async function fsListe(col){
  const out = []; let pageToken = '';
  do {
    const u = `${DOCS()}/${col}?pageSize=300${pageToken ? '&pageToken=' + encodeURIComponent(pageToken) : ''}`;
    const r = await requete(u, { headers:{ Authorization:'Bearer ' + await jeton() } });
    if (r.status === 404) return out;                       // collection encore vide
    if (!r.ok) throw new Error(await erreurFs(r));
    const d = await r.json();
    (d.documents || []).forEach(doc => out.push(objetFs(doc)));
    pageToken = d.nextPageToken || '';
  } while (pageToken);
  return out;
}
async function fsDoc(chemin){
  const r = await requete(`${DOCS()}/${chemin}`, { headers:{ Authorization:'Bearer ' + await jeton() } });
  if (r.status === 404) return null;

  return objetFs(await r.json());
}

function empreinteDe(src, cfgExiste){

const empreinte = () => empreinteDe(S);
function operations(){
  const cur = empreinte(), ops = [];
  COLS.forEach(c => {

    for (const id in a) if (a[id] !== b[id]) ops.push({ t:'set', col:c, id, data:S[c].find(x => x.id === id) });
    for (const id in b) if (!(id in a)) ops.push({ t:'del', col:c, id });
  });

  return ops;
}
async function fsEcrire(ops){
  for (let i = 0; i < ops.length; i += 400){
    const lot = ops.slice(i, i + 400).map(o => o.t === 'del'
      ? { delete: `${DOCS()}/${o.col}/${o.id}` }
      : { update: { name: `${DOCS()}/${o.col}/${o.id}`, fields: champsFs(o.data) } });
    const r = await requete(`${FS()}:commit`, {
      method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + await jeton() },
      body: JSON.stringify({ writes: lot }) });

    if (estHorsLigne(e)){ setStatus('📴 Hors ligne — enregistrement en attente'); clearTimeout(saveTimer); saveTimer = setTimeout(envoyer, 10000); }
    else if (/Session expirée/.test(m)){ setStatus('🔑 Session expirée'); ouvrirGate(m); }
    else if (/Accès refusé/.test(m)){ canWrite = false; setStatus('🔒 Lecture seule'); render(); info('Vos droits ne permettent pas d\'enregistrer. Les modifications restent dans ce navigateur mais ne sont pas partagées.'); }
    else { setStatus('⚠️ Non enregistré — nouvelle tentative…'); clearTimeout(saveTimer); saveTimer = setTimeout(envoyer, 8000); }
  } finally {
    enCours = false;
    if (aRejouer){ aRejouer = false; envoyer(); }
  }
}
/* Dernière tentative d'envoi avant fermeture de l'onglet */
addEventListener('beforeunload', e => {
  if (mode === 'cloud' && operations().length){ e.preventDefault(); e.returnValue = ''; }
});
addEventListener('online', () => { if (mode === 'cloud') envoyer(); });

/* ---------- Démarrage ---------- */
function normalize(){
  if (!Array.isArray(S.appels)) S.appels = [];
  S.bureaux.forEach(b => { if (!b.devise) b.devise = deviseDuPays(b.pays) || deviseBase(); });
  S.cotisations.forEach(c => { if (!c.type) c.type = 'Mensuelle'; });
  [...S.cotisations].filter(c => !c.recuNum).sort((a,b) => (a.date||'').localeCompare(b.date||'')).forEach(c => c.recuNum = nextRecu());
  S.membres.filter(m => !m.numero).sort((a,b) => (a.adhesion||'').localeCompare(b.adhesion||'')).forEach(m => { m.numero = nextNumero(); if (!m.creeLe) m.creeLe = m.adhesion || today(); });
  if (S.settings.cotisationMensuelle == null) S.settings.cotisationMensuelle = S.settings.cotisationAnnuelle ? Math.round(S.settings.cotisationAnnuelle / 12) : 10000;
}
normalize();
const h = location.hash.slice(1); if (VIEWS.some(x => x[0] === h)) view = h;

/* ---------- Écran de connexion ---------- */
function gateMsg(texte, type){
  const e = $('#gateMsg'); e.textContent = texte || ''; e.className = 'gate-msg' + (texte ? ' ' + (type || 'err') : '');
}
function ouvrirGate(message){
  const l = S.settings.logo; if (l){ $('#gateLogo').src = l; } else { $('#gateLogo').style.display = 'none'; }
  $('#gateTitle').textContent = S.settings.nom || 'Gestion de l\'association';
  $('#gate').classList.add('on');
  gateMsg(message || '', 'err');
  if (auth.email) $('#gateMail').value = auth.email;
  setTimeout(() => ($('#gateMail').value ? $('#gatePass') : $('#gateMail')).focus(), 60);
}
const fermerGate = () => $('#gate').classList.remove('on');
/* Repli quand Firebase n'est pas encore configuré : la plateforme reste utilisable,
   les données restent sur l'appareil et ne sont pas partagées. */
function modeLocal(){
  fermerGate(); mode = 'local'; canWrite = true;
  setStatus('💾 Mode local — données sur cet appareil');
  render();
  info('Vous travaillez en local : les données restent dans ce navigateur et ne sont pas partagées avec les autres bureaux. Activez la connexion par e-mail dans Firebase pour passer en ligne.');
}

async function gateSubmit(e){
  e.preventDefault();
  const b = $('#gateBtn'), mail = $('#gateMail').value.trim(), mdp = $('#gatePass').value;
  b.disabled = true; b.textContent = 'Connexion…'; gateMsg('');
  try {
    await fbConnexion(mail, mdp);
    $('#gatePass').value = '';
    fermerGate();
    await demarrerSession();
  } catch(err){
    if (err && err.config){
      /* Le projet Firebase existe mais la connexion par e-mail n'y est pas encore
         activée : inutile de bloquer l'utilisateur, on propose le mode local. */
      gateMsg('La connexion par e-mail n\'est pas encore activée sur le projet Firebase. En attendant, vous pouvez utiliser la plateforme sur cet appareil.', 'info');
      $('#gateLocal').style.display = '';
    }
    else gateMsg(estHorsLigne(err)
      ? 'Pas de connexion Internet : impossible de vérifier votre mot de passe. Réessayez une fois la liaison rétablie.'
      : String(err && err.message || err), 'err');
  } finally { b.disabled = false; b.textContent = 'Se connecter'; }
}

/* ---------- Profil et droits ---------- */
const ROLES = { admin:'Administrateur', tresorier:'Trésorier', lecteur:'Lecture seule' };
function montrerQui(){
  const w = $('#whoBox'); if (!w) return;
  if (!auth.uid){ w.style.display = 'none'; return; }
  w.style.display = '';
  w.innerHTML = `<b>${esc(auth.nom || auth.email)}</b>${esc(ROLES[auth.role] || 'Lecture seule')}
    <button onclick="deconnexion()">Se déconnecter</button>`;
}

/* ---------- Démarrage de la session ---------- */
async function demarrerSession(){
  setStatus('Chargement des données…');
  try {
    const p = await fsProfil();
    if (!p){
      canWrite = false; mode = 'bloque';
      render(); montrerQui();
      return ouvrirGate('Votre compte existe mais aucun profil ne lui est associé. Demandez à l\'administrateur de créer votre fiche dans la collection « users ».');
    }
    auth.role = p.role || 'lecteur'; auth.nom = p.nom || '';
    canWrite = auth.role === 'admin' || auth.role === 'tresorier';
    const data = await fsChargerTout();
    /* Base encore vide et des données déjà saisies sur cet appareil :
       on les conserve et on les envoie, au lieu de les effacer. */
    const premiereFois = data._vide && COLS.some(c => (S[c] || []).length);
    if (!premiereFois){
      COLS.forEach(c => { if (Array.isArray(data[c])) S[c] = data[c]; });
      if (data.settings) S.settings = data.settings;
    }
    normalize();
    mode = 'cloud';
    /* La référence est ce que contient le serveur : tout ce qui diffère part à l'enregistrement. */
    refServeur = empreinteDe(premiereFois ? { settings:{} } : data, data._cfg);
    cacheLocal();
    setStatus(canWrite ? '✅ Connecté — données en ligne' : '🔒 Lecture seule — données en ligne');
    render(); montrerQui();
    if (canWrite && operations().length) envoyer();
  } catch(err){
    const m = String(err && err.message || err);
    mode = 'local'; canWrite = false;
    if (/Session expirée/.test(m)){ clearSession(); return ouvrirGate(m); }
    setStatus('⚠️ Hors ligne — données du navigateur');
    render(); montrerQui();
    info(estHorsLigne(err)
      ? 'Pas de connexion Internet pour le moment. Vous consultez la dernière copie enregistrée sur cet appareil ; la modification des données est désactivée tant que la liaison n\'est pas rétablie.'
      : 'Les données en ligne n\'ont pas pu être chargées : ' + m + ' Vous consultez la dernière copie enregistrée sur cet appareil.');
  }
}

/* ---------- Lancement ---------- */
(async () => {
  try { const c = localStorage.getItem(CACHE_KEY) || localStorage.getItem('assoVillageState');
        if (c){ S = JSON.parse(c); normalize(); } } catch(e){}
  render();
  if (!fbPret()){
    mode = 'local'; canWrite = true;
    setStatus('💾 Mode local — Firebase non configuré');
    return info('Firebase n\'est pas encore configuré dans ce fichier : la plateforme fonctionne pour l\'instant dans ce navigateur uniquement. Renseignez apiKey et projectId en haut du script pour activer le partage en ligne.');
  }
  let session = null;
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){}
  if (!session || !session.refreshToken){ canWrite = false; render(); return ouvrirGate(); }
  auth.email = session.email || ''; auth.uid = session.uid || '';
  setStatus('Reconnexion…');
  auth.refreshToken = session.refreshToken;
  try { await fbRafraichir(session.refreshToken); }
  catch(err){
    /* Coupure réseau : on garde la session et on travaille sur la copie locale.
       Vrai refus d'authentification : on redemande le mot de passe. */
    if (estHorsLigne(err)){
      mode = 'local'; canWrite = false;
      setStatus('⚠️ Hors ligne — données du navigateur');
      render(); montrerQui();
      return info('Pas de connexion Internet pour le moment. Vous consultez la dernière copie enregistrée sur cet appareil ; elle se remettra à jour dès que la liaison sera rétablie.');
    }
    clearSession(); canWrite = false; render();
    return ouvrirGate('Session expirée, reconnectez-vous.');
  }
  await demarrerSession();
})();
</script>
